# =============================================================================
# crontab — Prospecção Fillipo (Contadores) & Luiggi (Comércio Exterior)
# Para instalar no VPS: crontab -e  e colar o conteúdo abaixo
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# 1. FILLIPO (Contadores - Porta 8081)
# ─────────────────────────────────────────────────────────────────────────────
# Disparar seg-sex às 08:00
0 8 * * 1-5 /usr/local/bin/start-prospecting.sh

# Encerrar seg-sex às 17:00
0 17 * * 1-5 /usr/local/bin/stop-prospecting.sh

# Monitorar a cada hora (segunda a sexta), entre 08:00 e 18:00
# 0 8-18 * * 1-5 /usr/local/bin/monitor-prospecting.sh


# ─────────────────────────────────────────────────────────────────────────────
# 2. LUIGGI (Comércio Exterior - Porta 8085)
# ─────────────────────────────────────────────────────────────────────────────
# Disparar seg-sex às 08:00
0 8 * * 1-5 /usr/local/bin/start-prospecting-luiggi.sh

# Encerrar seg-sex às 17:00
0 17 * * 1-5 /usr/local/bin/stop-prospecting-luiggi.sh

# Monitorar a cada hora (segunda a sexta), entre 08:00 e 18:00
# 0 8-18 * * 1-5 /usr/local/bin/monitor-prospecting-luiggi.sh
