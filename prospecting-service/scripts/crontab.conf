# =============================================================================
# crontab — Prospecção de Contadores (prospecting-service)
# Para instalar: crontab -e  e colar o conteúdo abaixo
# =============================================================================

# Disparar toda segunda-feira às 08:00
0 8 * * 1 /usr/local/bin/start-prospecting.sh

# Encerrar toda sexta-feira às 18:00
0 18 * * 5 /usr/local/bin/stop-prospecting.sh

# Monitorar a cada hora (segunda a sexta), entre 08:00 e 18:00
0 8-18 * * 1-5 /usr/local/bin/monitor-prospecting.sh
