spring:
  ai:
    model:
      chat: google-genai
      embedding: ollama        # embedding sempre no Ollama, mesmo com chat na nuvem
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.5-flash
            temperature: 0.1
            max-output-tokens: 1024
    ollama:
      base-url: http://localhost:11435   # container Ollama
      embedding:
        model: bge-m3
    vectorstore:
      pgvector:
        dimensions: 1024       # casa com o bge-m3
