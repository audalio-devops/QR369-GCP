server:
  port: ${VA_SERVER_PORT:8080}

spring:
  datasource:
    url: ${VA_DB_URL}
    username: ${VA_DB_USERNAME}
    password: ${VA_DB_PASSWORD}
  ai:
    vectorstore:
      pgvector:
        initialize-schema: true        # cria a extensao, a tabela e o indice no primeiro start
        index-type: HNSW               # indice de busca aproximada de vizinhos
        distance-type: COSINE_DISTANCE # distancia que casa com embeddings de sentenca
        table-name: ${PGVECTOR_TABLE_NAME:vector_store}
    chat:
      memory:
        redis:
          host: ${VA_REDIS_HOST:localhost}
          port: ${VA_REDIS_PORT:6379}
          time-to-live: PT30M # a conversa expira apos 30 min de inatividade

# bloco proprio do projeto (nao e do framework)
app:
  assistant:
    id: ${ASSISTANT_ID:fillipo}
  prompt:
    context-resource: ${APP_PROMPT_CONTEXT_RESOURCE:classpath:/prompts/context-prompt.st}
    system-resource: ${APP_PROMPT_SYSTEM_RESOURCE:}
  auth:
    username: ${LOGIN_USR}
    password: ${LOGIN_PWD}
  rag:
    top-k: 5 # quantos chunks o QuestionAnswerAdvisor recupera
    similarity-threshold: 0.2 # piso de similaridade do retrieval
    default-doc-resource: ${APP_RAG_DEFAULT_DOC_RESOURCE:classpath:/docs/Treinamento_Geral_Assistente.pdf}
  memory:
    max-messages: 20 # tamanho da janela do MessageWindowChatMemory
  zapi:
    api-url: "https://api.z-api.io/instances/${ZAPI_INSTANCE_ID:}/token/${ZAPI_TOKEN:}"
    send-message-endpoint: "/send-text"
    client-token: ${ZAPI_CLIENT_TOKEN:}
  assemblyai:
    api-key: ${ASSEMBLYAI_API_KEY:}
    language-code: "pt"

# nivel DEBUG apenas para o advisor que loga prompt (IDA) e resposta (VOLTA)
logging:
  level:
    br.com.ia369.virtual_assistant.chat.PromptLoggingAdvisor: INFO
