spring:
  ai:
    model:
      chat: anthropic
      embedding: ollama        # embedding sempre no Ollama, mesmo com chat na nuvem
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        model: claude-haiku-5-5
        # Haiku 5.5 tokeniza cerca de 30% mais tokens para o mesmo texto.
        # Ajuste proporcional ao limite anterior de 1024 para preservar o volume de saída.
        max-tokens: 1332
    ollama:
      base-url: http://localhost:11435   # container Ollama
      embedding:
        model: bge-m3
    vectorstore:
      pgvector:
        dimensions: 1024       # casa com o bge-m3d
